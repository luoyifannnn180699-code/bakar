<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - UjianKu Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
body { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 text-center">
        <div class="w-20 h-20 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-wifi-slash text-amber-600 text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Anda Sedang Offline</h1>
        <p class="text-slate-500 mb-6">Koneksi internet terputus. Beberapa fitur mungkin tidak tersedia.</p>
        <button onclick="location.reload()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl">
            <i class="fa-solid fa-rotate-right mr-2"></i> Coba Lagi
        </button>
        <p class="text-xs text-slate-400 mt-4">Ujian yang sedang berjalan tetap bisa dilanjutkan</p>
    </div>
</body>
</html>
